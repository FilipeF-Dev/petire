# =============================================================================
# Petire — verificação de cada mudança
#
# O trabalho mais importante daqui é o segundo job: ele levanta um banco do
# zero, **só a partir das migrations**, e constrói o site contra ele. É o que
# prova que o schema versionado no repositório é suficiente para o código rodar.
#
# Sem isso, uma migration esquecida no commit só aparece em produção — foi
# exatamente assim que o carrinho começou a sumir.
#
# Node 22 e não 20: o `@supabase/supabase-js` precisa de WebSocket nativo, que
# só existe a partir do 22. Com 20 o `check:rls` nem chega a rodar a primeira
# verificação — ele quebra ao criar o cliente.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Push novo na mesma branch cancela a verificação anterior: ninguém precisa do
# resultado de um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # `npm run typecheck` chama `next typegen` antes do tsc: `PageProps` e
      # `LayoutProps` são gerados pelo Next a partir da árvore de rotas, e sem
      # isso o tsc não os encontra. Na máquina de quem desenvolve eles já
      # existem de um `next dev` anterior — num clone limpo, e no CI, não.
      - name: Tipos
        run: npm run typecheck

      - name: Testes da lógica pura
        run: npm test

  banco:
    name: Migrations, RLS e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Versao fixa, e nao "latest": com "latest" a action pergunta a API do
      # GitHub qual e a ultima release a cada execucao, sem autenticacao — e o
      # limite de requisicoes derruba o CI por motivo nenhum, num erro que nao
      # tem nada a ver com o codigo do PR. Fixar tambem torna a execucao
      # reproduzivel: uma release nova do CLI deixa de poder quebrar o CI
      # sozinha, e a subida passa a ser uma decisao com PR.
      #
      # Acompanha a versao do devDependency  no package.json.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - run: npm ci

      # Banco vazio + migrations + seed. Se uma migration não aplicar numa base
      # limpa, o passo falha aqui e não em produção.
      - name: Subir o Supabase local
        run: supabase start

      - name: Aplicar migrations do zero
        run: supabase db reset

      # As chaves do stack local mudam a cada versão do CLI, então são lidas
      # dele em vez de ficarem escritas aqui.
      - name: Ler as chaves do stack local
        run: |
          supabase status -o env \
            | sed 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' \
            | sed 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/' \
            | sed 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | tr -d '"' >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"

      # Bug de RLS não quebra nada: só faz uma loja enxergar o cardápio da
      # outra. Por isso o script exercita os caminhos que precisam falhar.
      - name: Políticas de acesso
        run: |
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
            "$NEXT_PUBLIC_SUPABASE_URL" \
            "$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            "$SUPABASE_SERVICE_ROLE_KEY" > .env.local
          npm run check:rls

      # O build gera /loja/[slug] estaticamente, então ele consulta o banco de
      # verdade. É a prova final de que schema e código combinam.
      - name: Build
        run: npm run build

      # O teste de ponta a ponta vive aqui, e não no job de cima, porque
      # precisa exatamente do que este job já montou: banco com o seed e site
      # construído. Repetir isso num terceiro job dobraria o tempo do CI para
      # provar a mesma coisa duas vezes.
      #
      # Só o Chromium, e `--with-deps` porque o runner do GitHub não traz as
      # bibliotecas de sistema que o navegador precisa.
      - name: Instalar o navegador do teste
        run: npx playwright install --with-deps chromium

      # `npm start` sobe pelo próprio Playwright (webServer), contra o build
      # do passo anterior.
      - name: Caminho do pedido, ponta a ponta
        run: npm run test:e2e

      # O rastro do que falhou. Sem isto, um teste que só quebra no CI vira
      # adivinhação.
      - name: Guardar o rastro da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
