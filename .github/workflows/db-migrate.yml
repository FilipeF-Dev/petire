# =============================================================================
# Petire — aplicar as migrations em produção
#
# O problema que isto resolve: o deploy do código era automático e o do banco
# era manual. Bastava esquecer o `db:push` para o site subir pedindo colunas que
# o banco ainda não tinha — e foi assim que o carrinho do cliente começou a ser
# apagado.
#
# ORDEM. A Vercel também dispara no push para `main`, então os dois correm
# juntos. Isso é seguro porque **as migrations do Petire são aditivas**: coluna,
# tabela, função e policy novas. Código antigo ignora coluna nova, então o banco
# adiantado nunca quebra o site — só o contrário quebra. Manter essa disciplina
# é o que torna a corrida inofensiva.
#
# Se algum dia uma migration precisar remover ou renomear algo em uso, ela tem
# de ser partida em duas entregas: primeiro o código para de usar, depois a
# coluna sai. Não existe atalho para isso aqui.
# =============================================================================

name: Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  # Para aplicar a mão quando for preciso — inclusive na primeira vez, para
  # colocar o banco de produção em dia.
  workflow_dispatch:

# Duas migrations ao mesmo tempo no mesmo banco é como corromper o histórico.
# Sem cancelar a que já está rodando: metade aplicada é pior do que atrasada.
concurrency:
  group: db-migrate-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    # O ambiente permite exigir aprovação manual antes de tocar em produção,
    # se um dia isso fizer sentido. Ver Settings → Environments.
    environment: producao

    env:
      # A conexão com o banco, e só ela.
      #
      # Antes eram três segredos e um `supabase link`, que pergunta à API da
      # plataforma qual é a conexão — e para isso exige um **token pessoal**.
      # Isso pôs o deploy de produção na dependência de uma conta: o token
      # expira, perde privilégio quando o papel na organização muda, e some
      # junto com quem o criou. Foi exatamente assim que as migrations pararam
      # de subir por dois dias enquanto o código continuava subindo.
      #
      # O `db push` fala direto com o Postgres. Sem token, sem project ref, sem
      # papel de organização: se a string conecta, a migration aplica.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      # Versao fixa, e nao "latest": com "latest" a action pergunta a API do
      # GitHub qual e a ultima release a cada execucao, sem autenticacao — e o
      # limite de requisicoes derruba o CI por motivo nenhum, num erro que nao
      # tem nada a ver com o codigo do PR. Fixar tambem torna a execucao
      # reproduzivel: uma release nova do CLI deixa de poder quebrar o CI
      # sozinha, e a subida passa a ser uma decisao com PR.
      #
      # Acompanha a versao do devDependency  no package.json.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Falha cedo e com uma frase que se entende, em vez de deixar o CLI
      # reclamar de uma string vazia lá na frente.
      - name: Conferir o segredo
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL não está definido no ambiente 'producao'."
            echo "Pegue a string em Project Settings → Database → Connection string."
            exit 1
          fi

      # Mostra o que está pendente antes de aplicar. Quando algo der errado, o
      # log já diz qual migration estava entrando.
      - name: O que falta aplicar
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Aplicar
        run: supabase db push --db-url "$SUPABASE_DB_URL"
